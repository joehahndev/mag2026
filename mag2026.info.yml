name: 'Mag 2026'
type: theme
description: 'A standalone, dependency-free magazine theme for Drupal 10/11. A modern, Bootstrap-free rebuild of the classic "mag2" theme with a hand-written CSS grid and vanilla JavaScript.'
core_version_requirement: ^10 || ^11
# Standalone theme: `false` means it does not extend Bootstrap, Stable, Classy
# or Olivero. Drupal requires this key to be present (explicitly false).
base theme: false

libraries:
  - mag2026/global

# Regions match the classic layout so existing block placements map 1:1.
regions:
  navigation: 'Navigation'
  navigation_collapsible: 'Navigation (Collapsible)'
  header: 'Top Bar'
  highlighted: 'Highlighted'
  help: 'Help'
  content: 'Content'
  sidebar_first: 'Primary'
  sidebar_second: 'Secondary'
  footer: 'Footer'
  page_top: 'Page top'
  page_bottom: 'Page bottom'
